# Mosquitto for the Advanced Explorer (DESIGN D12). DEMO SETTINGS: anonymous access, no TLS.
# Reachable on the compose network; port 1883 is also published on the host for `make mqtt-watch`.
listener 1883
allow_anonymous true
# Persist queued QoS 1 messages for persistent sessions (the explorer subscribes with
# clean_session=False), so they survive a broker restart.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
